name: campus911
description: "App for students"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3

  google_generative_ai: ^0.4.3

  go_router: ^17.1.0
  provider: ^6.1.2

  google_fonts: ^8.0.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  fl_chart: ^1.1.1

  flutter_dotenv: ^6.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0
  test: any

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/ai_bot.png
