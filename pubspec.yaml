name: campus911
description: "Приложение для студентов"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.0

  logger: ^2.0.2

  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_generative_ai: ^0.4.3

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1

  go_router: ^17.1.0

  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1

  dash_chat_2: ^0.0.21

  table_calendar: ^3.1.2

  fl_chart: ^1.1.1

  image_picker: ^1.1.2

  flutter_local_notifications: ^20.0.0

  provider: ^6.1.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  test: any
  mockito: ^5.4.4
  build_runner: any
  firebase_auth_mocks: any
  fake_cloud_firestore: any
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/ai_bot.png
